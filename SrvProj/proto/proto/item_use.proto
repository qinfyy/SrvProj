syntax = "proto3";

package proto;

import "public.proto";

message PickItem {
    uint64 Id = 1;
    uint32 Tid = 2;
    uint32 SelectTid = 3;
    uint32 Qty = 4;
    bytes NextPackage = 2047;
}

message PickItems {
    repeated PickItem List = 1;
    bytes NextPackage = 2047;
}

message UseItem {
    repeated ItemInfo List = 1;
    bytes NextPackage = 2047;
}

message ItemUseReq {
    bytes NextPackage = 2047;
    oneof Mode {
        PickItems Pick = 1;
        UseItem Use = 2;
    }
}
