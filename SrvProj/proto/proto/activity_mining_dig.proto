syntax = "proto3";

package proto;

import "public.proto";
import "public_mining.proto";

message ActivityMiningDigReq {
    uint32 ActivityId = 1;
    uint32 GridId = 2;
    bytes NextPackage = 2047;
}

message ActivityMiningDigResp {
    ChangeInfo ChangeInfo = 1;
    MiningChangeInfo MiningChangeInfo = 2;
    bytes NextPackage = 2047;
}
