syntax = "proto3";

package proto;

import "public.proto";

message DiscStrengthenReq {
    uint32 Id = 1;
    repeated ItemInfo Items = 2;
    bytes NextPackage = 2047;
}

message DiscStrengthenResp {
    uint32 Level = 1;
    uint32 Exp = 2;
    ChangeInfo Change = 3;
    bytes NextPackage = 2047;
}
