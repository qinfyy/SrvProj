syntax = "proto3";

package proto;

import "public.proto";
import "public_joint_drill.proto";
import "public_star_tower.proto";

message JointDrillRankInfo {
    int64 LastRefreshTime = 1;
    JointDrillRankData Self = 2;
    repeated JointDrillRankData Rank = 3;
    uint32 Total = 4;
    bytes NextPackage = 2047;
}

message JointDrillRankChar {
    uint32 Id = 1;
    uint32 Level = 2;
    bytes NextPackage = 2047;
}

message JointDrillRankTeam {
    repeated JointDrillRankChar Chars = 1;
    uint32 BuildScore = 2;
    uint32 Damage = 3;
    uint32 Time = 4;
    repeated uint32 Discs = 5;
    repeated BuildPotential Potentials = 6;
    repeated ItemTpl Notes = 7;
    repeated uint32 ActiveSecondaryIds = 8;
    bytes NextPackage = 2047;
}

message JointDrillRankData {
    uint64 Id = 1;
    string NickName = 2;
    uint32 WorldClass = 3;
    uint32 HeadIcon = 4;
    uint32 Score = 5;
    uint32 Rank = 6;
    uint32 TitlePrefix = 7;
    uint32 TitleSuffix = 8;
    repeated HonorInfo Honors = 9;
    repeated JointDrillRankTeam Teams = 10;
    bytes NextPackage = 2047;
}

message JointDrillRankTeams {
    repeated JointDrillRankTeam Teams = 1;
    bytes NextPackage = 2047;
}
