syntax = "proto3";

package proto;

import "public.proto";

message CharUpgradeReq {
    uint32 CharId = 1;
    repeated ItemTpl Items = 2;
    bytes NextPackage = 2047;
}

message CharUpgradeResp {
    uint32 Level = 1;
    uint32 Exp = 2;
    ChangeInfo Change = 3;
    bytes NextPackage = 2047;
}
