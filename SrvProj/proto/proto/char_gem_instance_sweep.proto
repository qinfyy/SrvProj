syntax = "proto3";

package proto;

import "public.proto";

message CharGemInstanceSweepReq {
    uint32 Id = 1;
    uint32 Times = 2;
    Events Events = 15;
    bytes NextPackage = 2047;
}

message CharGemInstanceSweepReward {
    repeated ItemTpl AwardItems = 1;
    uint32 Exp = 2;
    bytes NextPackage = 2047;
}

message CharGemInstanceSweepResp {
    ChangeInfo Change = 1;
    repeated CharGemInstanceSweepReward Rewards = 2;
    bytes NextPackage = 2047;
}
