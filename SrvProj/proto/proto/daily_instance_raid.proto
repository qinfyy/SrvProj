syntax = "proto3";

package proto;

import "public.proto";

message DailyInstanceRaidReq {
    uint32 Id = 1;
    uint32 RewardType = 2;
    uint32 Times = 4;
    Events Events = 15;
    bytes NextPackage = 2047;
}

message DailyInstanceReward {
    repeated Item Select = 1;
    repeated Item DoubleItems = 2;
    uint32 Exp = 15;
    bytes NextPackage = 2047;
}

message DailyInstanceRaidResp {
    repeated DailyInstanceReward Rewards = 1;
    ChangeInfo Change = 2;
    bytes NextPackage = 2047;
}
