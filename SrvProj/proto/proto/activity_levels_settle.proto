syntax = "proto3";

package proto;

import "public.proto";

message ActivityLevelsSettleReq {
    uint32 ActivityId = 1;
    uint32 Star = 2;
    Events Events = 3;
    bytes NextPackage = 2047;
}

message ActivityLevelsSettleResp {
    ChangeInfo ChangeInfo = 1;
    repeated ItemTpl First = 2;
    uint32 Exp = 3;
    repeated ItemTpl Fixed = 4;
    bytes NextPackage = 2047;
}
