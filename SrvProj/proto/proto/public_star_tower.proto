syntax = "proto3";

package proto;

import "public.proto";
import "traveler_duel_rank_upload.proto";

message StarTowerInfo {
    StarTowerMeta Meta = 1;
    StarTowerRoom Room = 2;
    StarTowerBag Bag = 3;
    bytes NextPackage = 2047;
}

message StarTowerMeta {
    uint32 Id = 1;
    uint32 CharHp = 2;
    uint32 TeamLevel = 3;
    uint32 TeamExp = 4;
    repeated StarTowerChar Chars = 5;
    repeated StarTowerDisc Discs = 6;
    uint32 DateLen = 7;
    string ClientData = 8;
    repeated uint32 ActiveSecondaryIds = 9;
    uint32 NPCInteractions = 10;
    repeated uint32 TowerGrowthNodes = 11;
    uint32 ResurrectionCnt = 12;
    uint32 TotalTime = 14;
    repeated uint64 TotalDamages = 15;
    uint64 BuildId = 16;
    uint32 DataVersion = 17;
    bytes NextPackage = 2047;
}

message StarTowerDisc {
    uint32 Id = 1;
    uint32 Level = 2;
    uint32 Phase = 3;
    uint32 Star = 4;
    bytes NextPackage = 2047;
}

message StarTowerChar {
    uint32 Id = 1;
    repeated StarTowerCharGem Gems = 2;
    uint32 Level = 3;
    repeated uint32 SkillLvs = 4;
    uint32 AffinityLevel = 5;
    uint32 Advance = 6;
    bytes TalentNodes = 7;
    bytes NextPackage = 2047;
}

message StarTowerCharGem {
    repeated uint32 Attributes = 1;
    uint32 SlotId = 2;
    repeated uint32 OverlockCount = 3;
    bytes NextPackage = 2047;
}

message StarTowerBag {
    repeated FateCardInfo FateCard = 1;
    repeated PotentialInfo Potentials = 2;
    repeated TowerItemInfo Items = 3;
    repeated TowerResInfo Res = 4;
    bytes NextPackage = 2047;
}

message StarTowerRoom {
    StarTowerRoomData Data = 1;
    repeated StarTowerRoomCase Cases = 2;
    bytes NextPackage = 2047;
}

message StarTowerRoomData {
    uint32 Floor = 1;
    uint32 MapId = 2;
    uint32 ParamId = 3;
    uint32 RoomType = 4;
    string MapParam = 5;
    uint32 MapTableId = 6;
    bytes NextPackage = 2047;
}

message StarTowerRoomCase {
    uint32 Id = 1;
    bytes NextPackage = 2047;
    oneof Data {
        BattleCaseData BattleCase = 2;
        DoorCaseData DoorCase = 3;
        SelectSpecialPotentialCaseData SelectSpecialPotentialCase = 4;
        SelectPotentialCaseData SelectPotentialCase = 5;
        SelectFateCardCaseData SelectFateCardCase = 6;
        SelectOptionsEventCaseData SelectOptionsEventCase = 8;
        RecoveryHPCaseData RecoveryHPCase = 9;
        NpcRecoveryHPCaseData NpcRecoveryHPCase = 10;
        HawkerCaseData HawkerCase = 11;
        StrengthenMachineCaseData StrengthenMachineCase = 12;
        SyncHPCaseData SyncHPCase = 15;
    }
}

message BattleCaseData {
    bool TimeLimit = 1;
    bool FateCard = 2;
    uint32 SubNoteSkillNum = 3;
    bytes NextPackage = 2047;
}

message DoorCaseData {
    uint32 Floor = 1;
    uint32 Type = 2;
    bytes NextPackage = 2047;
}

message SelectSpecialPotentialCaseData {
    repeated uint32 Ids = 1;
    uint32 TeamLevel = 2;
    repeated uint32 NewIds = 3;
    bool CanReRoll = 7;
    uint32 ReRollPrice = 8;
    bytes NextPackage = 2047;
}

message SelectPotentialCaseData {
    repeated PotentialInfo Infos = 1;
    uint32 TeamLevel = 2;
    repeated uint32 NewIds = 3;
    repeated uint32 LuckyIds = 12;
    bool CanReRoll = 13;
    uint32 ReRollPrice = 14;
    uint32 Type = 15;
    bytes NextPackage = 2047;
}

message SelectOptionsEventCaseData {
    uint32 EvtId = 1;
    repeated uint32 Options = 2;
    repeated uint32 FailedIdxes = 3;
    uint32 NPCId = 4;
    bool Done = 5;
    repeated NPCAffinityInfo Infos = 6;
    bytes NextPackage = 2047;
}

message SelectFateCardCaseData {
    repeated uint32 Ids = 1;
    repeated uint32 NewIds = 2;
    bool Give = 3;
    bool CanReRoll = 7;
    uint32 ReRollPrice = 8;
    bytes NextPackage = 2047;
}

message RecoveryHPCaseData {
    uint32 EffectId = 1;
    bytes NextPackage = 2047;
}

message NpcRecoveryHPCaseData {
    uint32 EffectId = 1;
    bytes NextPackage = 2047;
}

message SyncHPCaseData {
    bytes NextPackage = 2047;
}

message HawkerGoods {
    uint32 Sid = 1;
    uint32 Idx = 2;
    uint32 CharPos = 3;
    int32 Price = 4;
    int32 Discount = 5;
    uint32 Type = 6;
    uint32 GoodsId = 7;
    uint32 Tag = 15;
    bytes NextPackage = 2047;
}

message HawkerCaseData {
    repeated HawkerGoods List = 1;
    repeated uint32 Purchase = 2;
    bool CanReRoll = 7;
    uint32 ReRollPrice = 8;
    uint32 ReRollTimes = 9;
    bytes NextPackage = 2047;
}

message InteractHawkerReq {
    bytes NextPackage = 2047;
    oneof Action {
        uint32 Sid = 1;
        bool ReRoll = 2;
    }
}

message InteractStrengthenMachineResp {
    bool BuySucceed = 1;
    bytes NextPackage = 2047;
}

message StrengthenMachineCaseData {
    uint32 Times = 1;
    bool FirstFree = 7;
    uint32 Discount = 8;
    bytes NextPackage = 2047;
}

message InteractEnterReq {
    uint32 MapId = 1;
    uint32 ParamId = 2;
    uint32 DateLen = 3;
    string ClientData = 4;
    string MapParam = 5;
    uint32 MapTableId = 6;
    uint32 DataVersion = 7;
    bytes NextPackage = 2047;
}

message InteractEnterResp {
    StarTowerRoom Room = 1;
    bytes NextPackage = 2047;
}

message InteractBattleEndReq {
    bytes NextPackage = 2047;
    oneof Result {
        VictoryData Victory = 1;
        bool Defeat = 2;
    }
    message VictoryData {
        uint32 HP = 1;
        uint32 Time = 2;
        uint32 DateLen = 3;
        string ClientData = 4;
        repeated FateCardUsage fateCardUsage = 5;
        repeated uint32 Damages = 6;
        uint32 DataVersion = 7;
        Events Events = 15;
    }

}

message InteractBattleEndResp {
    bytes NextPackage = 2047;
    oneof Result {
        VictoryData Victory = 1;
        DefeatData Defeat = 2;
    }
    message VictoryData {
        uint32 Exp = 1;
        uint32 Lv = 2;
        uint32 BattleTime = 10;
    }

    message DefeatData {
        uint32 Lv = 1;
    }

}

message InteractRecoveryHPReq {
    uint32 Hp = 1;
    bytes NextPackage = 2047;
}

message FateCardUsage {
    uint32 Id = 1;
    uint32 Times = 2;
    bytes NextPackage = 2047;
}

message InteractSelectReq {
    bytes NextPackage = 2047;
    oneof Select {
        uint32 Index = 1;
        bool ReRoll = 2;
    }
}

message InteractSelectResp {
    bytes NextPackage = 2047;
    oneof Result {
        Success Resp = 1;
        SelectSpecialPotentialCaseData SelectSpecialPotentialCase = 2;
        SelectPotentialCaseData SelectPotentialCase = 3;
        SelectFateCardCaseData SelectFateCardCase = 4;
        HawkerCaseData HawkerCase = 5;
    }
    message Success {
        repeated ItemTpl Items = 1;
        bool OptionsResult = 2;
        repeated FateCardInfo FateCard = 3;
        repeated SubNoteSkillInfo SubNoteSkills = 4;
        uint32 OptionsParamId = 5;
        repeated NPCAffinityChange AffinityChange = 6;
    }

}

message FateCardInfo {
    uint32 Tid = 1;
    int32 Qty = 2;
    int32 Remain = 3;
    int32 Room = 4;
    bytes NextPackage = 2047;
}

message PotentialInfo {
    uint32 Tid = 1;
    int32 Level = 2;
    bytes NextPackage = 2047;
}

message TowerItemInfo {
    uint32 Tid = 1;
    int32 Qty = 2;
    bytes NextPackage = 2047;
}

message TowerResInfo {
    uint32 Tid = 1;
    int32 Qty = 2;
    bytes NextPackage = 2047;
}

message SubNoteSkillInfo {
    uint32 Tid = 1;
    int32 Qty = 2;
    bool New = 3;
    uint32 LuckyLevel = 4;
    bytes NextPackage = 2047;
}

message FirstAward {
    uint32 TowerId = 1;
    repeated ItemTpl Items = 2;
    bytes NextPackage = 2047;
}

message SettleDataResp {
    ChangeInfo Change = 1;
    StarTowerBuildInfo Build = 2;
    repeated FirstAward Awards = 3;
    repeated NPCAffinityLevelReward Reward = 4;
    uint32 NpcInteraction = 5;
    repeated ItemTpl TowerRewards = 6;
    uint32 TotalTime = 14;
    repeated uint64 TotalDamages = 15;
    bytes NextPackage = 2047;
}

message TowerBuildChar {
    uint32 CharId = 1;
    uint32 PotentialCnt = 2;
    bytes NextPackage = 2047;
}

message BuildPotential {
    uint32 PotentialId = 1;
    uint32 Level = 2;
    bytes NextPackage = 2047;
}

message StarTowerBuildInfo {
    StarTowerBuildBrief Brief = 1;
    StarTowerBuildDetail Detail = 2;
    uint32 BuildCoin = 3;
    bytes NextPackage = 2047;
}

message StarTowerBuildBrief {
    uint64 Id = 1;
    string Name = 2;
    bool Lock = 3;
    bool Preference = 4;
    uint32 Score = 5;
    repeated uint32 DiscIds = 6;
    repeated TowerBuildChar Chars = 7;
    uint32 StarTowerId = 8;
    bytes NextPackage = 2047;
}

message StarTowerBuildDetail {
    repeated BuildPotential Potentials = 1;
    repeated ItemTpl SubNoteSkills = 2;
    repeated uint32 ActiveSecondaryIds = 3;
    bytes NextPackage = 2047;
}

message StarTowerBookCharPotentialBrief {
    uint32 CharId = 1;
    uint32 Count = 2;
    bytes NextPackage = 2047;
}

message StarTowerBookPotential {
    uint32 Id = 1;
    uint32 Level = 2;
    bytes NextPackage = 2047;
}

message StarTowerBookCharPotential {
    uint32 CharId = 1;
    repeated StarTowerBookPotential Potentials = 2;
    bytes NextPackage = 2047;
}

message TowerChangeData {
    repeated SubNoteSkillInfo Infos = 1;
    repeated ActiveSecondaryChange Secondaries = 2;
    bytes NextPackage = 2047;
}

message ActiveSecondaryChange {
    uint32 SecondaryId = 1;
    bool Active = 2;
    bytes NextPackage = 2047;
}

message NPCAffinityInfo {
    uint32 NPCId = 1;
    uint32 Affinity = 2;
    bytes NextPackage = 2047;
}

message NPCAffinityChange {
    uint32 NPCId = 1;
    uint32 Affinity = 2;
    uint32 Increase = 3;
    bytes NextPackage = 2047;
}

message NPCAffinityLevelReward {
    NPCAffinityChange Change = 1;
    repeated ItemTpl Items = 2;
    bytes NextPackage = 2047;
}

message PotentialPreselection {
    uint64 Id = 1;
    string Name = 2;
    bool Preference = 3;
    repeated StarTowerBookCharPotential CharPotentials = 4;
    uint64 Timestamp = 5;
    bytes NextPackage = 2047;
}
